name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - app/**
      - screenshot-service/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

concurrency:
  group: deployment
  cancel-in-progress: true

env:
  WASP_VERSION: 0.25.0
  SERVER_APP_NAME: tokenshelf-server
  SERVER_APP_URL: https://api.tokenshelf.dev
  CLIENT_APP_NAME: tokenshelf-client
  SCREENSHOT_APP_NAME: tokenshelf-screenshot-service
  DOCKER_REGISTRY: ghcr.io
  DOCKER_REGISTRY_USERNAME: ${{ github.repository_owner }}
  DOCKER_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build-and-push-images:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ env.DOCKER_REGISTRY_USERNAME }}
          password: ${{ env.DOCKER_REGISTRY_PASSWORD }}

      - name: Extract server image metadata
        id: meta-server
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REGISTRY_USERNAME }}/${{ env.SERVER_APP_NAME }}

      - name: Extract client image metadata
        id: meta-client
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REGISTRY_USERNAME }}/${{ env.CLIENT_APP_NAME }}

      - name: Extract screenshot service image metadata
        id: meta-screenshot
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REGISTRY_USERNAME }}/${{ env.SCREENSHOT_APP_NAME }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.14.1

      - name: Install Wasp
        run: npm install --global @wasp.sh/wasp-cli@${{ env.WASP_VERSION }}

      - name: Install Wasp app dependencies
        run: wasp install

      - name: Build Wasp app
        run: wasp build

      - name: Build client
        run: npx vite build
        env:
          REACT_APP_API_URL: ${{ env.SERVER_APP_URL }}

      - name: Test screenshot service
        run: npm --prefix ../screenshot-service ci && npm --prefix ../screenshot-service test

      - name: Prepare client Dockerfile
        run: |
          printf '%s\n' \
            'FROM pierrezemb/gostatic' \
            'CMD ["-fallback", "200.html", "-enable-logging"]' \
            'COPY ./build /srv/http' \
            > .wasp/out/web-app/Dockerfile

      - name: Build and push server image
        uses: docker/build-push-action@v7
        with:
          context: app/.wasp/out
          file: app/.wasp/out/Dockerfile
          push: true
          tags: ${{ steps.meta-server.outputs.tags }}
          labels: ${{ steps.meta-server.outputs.labels }}

      - name: Build and push client image
        uses: docker/build-push-action@v7
        with:
          context: app/.wasp/out/web-app
          file: app/.wasp/out/web-app/Dockerfile
          push: true
          tags: ${{ steps.meta-client.outputs.tags }}
          labels: ${{ steps.meta-client.outputs.labels }}

      - name: Build and push screenshot service image
        uses: docker/build-push-action@v7
        with:
          context: screenshot-service
          file: screenshot-service/Dockerfile
          push: true
          tags: ${{ steps.meta-screenshot.outputs.tags }}
          labels: ${{ steps.meta-screenshot.outputs.labels }}

      - name: Trigger Coolify deploys
        env:
          COOLIFY_SERVER_WEBHOOK: ${{ secrets.COOLIFY_SERVER_WEBHOOK }}
          COOLIFY_CLIENT_WEBHOOK: ${{ secrets.COOLIFY_CLIENT_WEBHOOK }}
          COOLIFY_SCREENSHOT_WEBHOOK: ${{ secrets.COOLIFY_SCREENSHOT_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          curl --request POST --fail-with-body --silent --show-error "$COOLIFY_SCREENSHOT_WEBHOOK" --header "Authorization: Bearer $COOLIFY_TOKEN"
          curl --request POST --fail-with-body --silent --show-error "$COOLIFY_SERVER_WEBHOOK" --header "Authorization: Bearer $COOLIFY_TOKEN"
          curl --request POST --fail-with-body --silent --show-error "$COOLIFY_CLIENT_WEBHOOK" --header "Authorization: Bearer $COOLIFY_TOKEN"
