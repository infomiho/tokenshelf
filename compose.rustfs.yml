services:
  rustfs:
    image: rustfs/rustfs:1.0.0-rc.1
    command: /data
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: error
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  bootstrap:
    image: amazon/aws-cli:2.27.49
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:?}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:?}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket tokenshelf-public >/dev/null 2>&1 ||
        aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket tokenshelf-public;
        aws --endpoint-url http://rustfs:9000 s3api put-bucket-policy --bucket tokenshelf-public
        --policy '{"Version":"2012-10-17","Statement":[{"Sid":"PublicRead","Effect":"Allow","Principal":"*","Action":"s3:GetObject","Resource":"arn:aws:s3:::tokenshelf-public/public/*"}]}'
    restart: "no"
    exclude_from_hc: true

volumes:
  rustfs-data:
