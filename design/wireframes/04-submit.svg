<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"
     font-family="-apple-system, system-ui, sans-serif" fill="#fff" stroke="#000" stroke-width="1.5">
  <!-- 04 Submit with your agent · minimal · desktop 1280x800 -->
  <rect x="0" y="0" width="1280" height="800" />

  <!-- navbar -->
  <rect width="1280" height="64" />
  <rect x="24" y="16" width="32" height="32" rx="4" fill="#E3E9E5" />
  <text x="72" y="38" font-size="14" font-weight="700" stroke="none" fill="#000">Tokenshelf</text>
  <circle cx="1232" cy="32" r="16" fill="#E3E9E5" />
  <text x="1208" y="38" font-size="12" text-anchor="end" stroke="none" fill="#666">miho</text>

  <!-- title -->
  <text x="40" y="124" font-size="28" font-weight="700" stroke="none" fill="#000">Submit a design system</text>

  <!-- primary: submit with your agent -->
  <g transform="translate(40,160)">
    <rect width="736" height="304" rx="6" />
    <text x="24" y="40" font-size="20" font-weight="600" stroke="none" fill="#000">Submit with your agent</text>
    <rect x="24" y="64" width="688" height="112" fill="#F1F5F2" />
    <text x="40" y="92" font-size="12" stroke="none" fill="#000">Package my design system as a Tokenshelf standard-format doc and POST it</text>
    <text x="40" y="112" font-size="12" stroke="none" fill="#000">to tokenshelf.dev/api/systems with my submit token tk_miho_8f3a.</text>
    <text x="40" y="132" font-size="12" stroke="none" fill="#000">Include colors, type, spacing, radius, components, motion.</text>
    <text x="40" y="152" font-size="12" stroke="none" fill="#000">Then give me the draft link to review.</text>
    <g transform="translate(24,200)">
      <rect width="208" height="48" rx="4" fill="#2D6A4F" />
      <text x="104" y="30" font-size="14" text-anchor="middle" stroke="none" fill="#fff">Copy agent prompt</text>
    </g>
    <text x="24" y="284" font-size="12" stroke="none" fill="#666">Your agent submits a draft; you review it before it publishes.</text>
  </g>

  <!-- fallback: manual paste (collapsed) -->
  <g transform="translate(40,488)">
    <rect width="736" height="56" rx="6" />
    <text x="24" y="34" font-size="14" stroke="none" fill="#666">Prefer by hand? Paste the standard format yourself</text>
    <text x="544" y="34" font-size="14" stroke="none" fill="#2D6A4F">View the spec →</text>
    <polyline points="688,20 696,28 688,36" fill="none" stroke="#666" />
  </g>

  <!-- drafts panel -->
  <g transform="translate(808,160)">
    <rect width="432" height="168" rx="6" />
    <text x="24" y="36" font-size="20" font-weight="600" stroke="none" fill="#000">Your drafts</text>
    <text x="24" y="60" font-size="12" stroke="none" fill="#666">Agent submissions land here</text>
    <g transform="translate(24,80)">
      <rect width="384" height="64" rx="6" />
      <text x="16" y="28" font-size="14" font-weight="600" stroke="none" fill="#000">Formisch</text>
      <text x="16" y="48" font-size="12" stroke="none" fill="#666">from your agent · 2 min ago · valid</text>
      <g transform="translate(280,12)">
        <rect width="88" height="40" rx="4" fill="#2D6A4F" />
        <text x="44" y="25" font-size="14" text-anchor="middle" stroke="none" fill="#fff">Review</text>
      </g>
    </g>
  </g>

  <!-- annotations -->
  <g data-region="annotations">
    <g transform="translate(24,200)">
      <circle r="12" fill="#fff" stroke="#d33" stroke-dasharray="4 2" />
      <text y="4" font-size="12" font-weight="700" text-anchor="middle" stroke="none" fill="#d33">1</text>
    </g>
    <g transform="translate(792,196)">
      <circle r="12" fill="#fff" stroke="#d33" stroke-dasharray="4 2" />
      <text y="4" font-size="12" font-weight="700" text-anchor="middle" stroke="none" fill="#d33">2</text>
    </g>
    <g transform="translate(24,516)">
      <circle r="12" fill="#fff" stroke="#d33" stroke-dasharray="4 2" />
      <text y="4" font-size="12" font-weight="700" text-anchor="middle" stroke="none" fill="#d33">3</text>
    </g>
  </g>
</svg>
