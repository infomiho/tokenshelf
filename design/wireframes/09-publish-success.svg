<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="-apple-system, system-ui, sans-serif" fill="#fff" stroke="#000" stroke-width="1.5">
  <!-- Desktop viewport: 1280x800 -->
  <rect x="0" y="0" width="1280" height="800" />
  <g transform="translate(0,0)"><rect width="1280" height="64" /><text x="48" y="40" font-size="20" font-weight="600" stroke="none" fill="#000">TOKENSHELF</text><circle cx="1216" cy="32" r="16" fill="#e6e6e6" /></g>
  <!-- 1: completed context -->
  <g transform="translate(48,96)"><text x="0" y="28" font-size="28" font-weight="700" stroke="none" fill="#000">Gridline</text></g>
  <!-- 2: published preview -->
  <g transform="translate(48,184)"><rect width="752" height="480" rx="6" fill="#e6e6e6" /><rect x="32" y="32" width="688" height="64" rx="4" /><text x="56" y="72" font-size="28" font-weight="700" stroke="none" fill="#000">Gridline</text><rect x="32" y="120" width="320" height="136" rx="4" /><rect x="376" y="120" width="344" height="136" rx="4" /><rect x="32" y="280" width="688" height="168" rx="4" /></g>
  <!-- 3: inline success replaces editing controls -->
  <g transform="translate(824,184)" data-region="success-state">
    <rect width="408" height="336" rx="6" />
    <circle cx="48" cy="48" r="16" /><polyline points="40,48 47,55 58,40" fill="none" />
    <text x="24" y="96" font-size="20" font-weight="600" stroke="none" fill="#000">Gridline is updated</text>
    <text x="24" y="128" font-size="14" stroke="none" fill="#666">Your changes are live.</text>
    <line x1="24" y1="160" x2="384" y2="160" />
    <text x="24" y="192" font-size="12" stroke="none" fill="#666">STATUS</text>
    <text x="24" y="224" font-size="14" font-weight="600" stroke="none" fill="#000">Published</text>
    <g transform="translate(24,248)"><rect width="360" height="48" rx="4" fill="#000" /><text x="180" y="30" font-size="14" font-weight="600" text-anchor="middle" stroke="none" fill="#fff">View updated system</text></g>
    <text x="204" y="320" font-size="14" text-anchor="middle" text-decoration="underline" stroke="none" fill="#000">View your design systems</text>
  </g>
  <g data-region="annotations"><circle cx="816" cy="176" r="12" fill="#fff" stroke="#d33" stroke-dasharray="4 2" /><text x="816" y="180" font-size="12" font-weight="700" text-anchor="middle" stroke="none" fill="#d33">1</text></g>
</svg>
