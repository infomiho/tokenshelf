<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="-apple-system, system-ui, sans-serif" fill="#fff" stroke="#000" stroke-width="1.5">
  <!-- Desktop viewport: 1280x800 -->
  <rect x="0" y="0" width="1280" height="800" />
  <!-- 1: underlying editing workspace -->
  <g opacity="0.5"><rect x="0" y="0" width="1280" height="64" /><text x="48" y="40" font-size="20" font-weight="600" stroke="none" fill="#000">TOKENSHELF</text><text x="48" y="124" font-size="28" font-weight="700" stroke="none" fill="#000">Editing Gridline</text><rect x="48" y="184" width="752" height="480" fill="#e6e6e6" /><rect x="824" y="184" width="408" height="400" /></g>
  <rect x="0" y="0" width="1280" height="800" fill="#000" fill-opacity="0.4" stroke="none" />
  <!-- 2: discard confirmation -->
  <g transform="translate(320,224)" data-region="discard-dialog">
    <rect width="640" height="352" rx="6" />
    <text x="24" y="48" font-size="20" font-weight="600" stroke="none" fill="#000">Discard draft changes?</text>
    <line x1="0" y1="72" x2="640" y2="72" />
    <text x="24" y="120" font-size="14" stroke="none" fill="#000">Unpublished changes will be lost.</text>
    <text x="24" y="152" font-size="14" stroke="none" fill="#000">Gridline will remain published, and agent access will end.</text>
    <line x1="0" y1="272" x2="640" y2="272" />
    <g transform="translate(304,296)"><rect width="120" height="40" rx="4" /><text x="60" y="25" font-size="14" text-anchor="middle" stroke="none" fill="#000">Cancel</text></g>
    <g transform="translate(440,296)"><rect width="176" height="40" rx="4" fill="#000" /><text x="88" y="25" font-size="14" font-weight="600" text-anchor="middle" stroke="none" fill="#fff">Discard draft changes</text></g>
  </g>
  <g data-region="annotations"><circle cx="624" cy="560" r="12" fill="#fff" stroke="#d33" stroke-dasharray="4 2" /><text x="624" y="564" font-size="12" font-weight="700" text-anchor="middle" stroke="none" fill="#d33">1</text><text x="648" y="564" font-size="12" stroke="none" fill="#d33">Initial focus on Cancel</text></g>
</svg>
