<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="-apple-system, system-ui, sans-serif" fill="#fff" stroke="#000" stroke-width="1.5">
  <!-- Desktop viewport: 1280x800 -->
  <rect x="0" y="0" width="1280" height="800" />
  <g opacity="0.5"><rect x="0" y="0" width="1280" height="64" /><text x="48" y="40" font-size="20" font-weight="600" stroke="none" fill="#000">TOKENSHELF</text><text x="48" y="124" font-size="28" font-weight="700" stroke="none" fill="#000">Editing Gridline</text><rect x="48" y="184" width="752" height="480" fill="#e6e6e6" /><rect x="824" y="184" width="408" height="400" /></g>
  <rect x="0" y="0" width="1280" height="800" fill="#000" fill-opacity="0.4" stroke="none" />
  <!-- 1: discard conflict remains in dialog context -->
  <g transform="translate(320,216)" data-region="discard-conflict">
    <rect width="640" height="368" rx="6" />
    <circle cx="48" cy="48" r="16" /><text x="48" y="53" font-size="20" font-weight="600" text-anchor="middle" stroke="none" fill="#000">!</text>
    <text x="80" y="56" font-size="20" font-weight="600" stroke="none" fill="#000">Draft changed before it could be discarded</text>
    <line x1="0" y1="88" x2="640" y2="88" />
    <text x="24" y="136" font-size="14" stroke="none" fill="#000">The draft changed. Review the latest version before</text>
    <text x="24" y="168" font-size="14" stroke="none" fill="#000">deciding whether to discard it.</text>
    <text x="24" y="232" font-size="12" stroke="none" fill="#666">Gridline remains published and unchanged.</text>
    <line x1="0" y1="288" x2="640" y2="288" />
    <g transform="translate(352,312)"><rect width="120" height="40" rx="4" /><text x="60" y="25" font-size="14" text-anchor="middle" stroke="none" fill="#000">Cancel</text></g>
    <g transform="translate(488,312)"><rect width="128" height="40" rx="4" fill="#000" /><text x="64" y="25" font-size="14" font-weight="600" text-anchor="middle" stroke="none" fill="#fff">Review draft</text></g>
  </g>
  <g data-region="annotations"><circle cx="952" cy="568" r="12" fill="#fff" stroke="#d33" stroke-dasharray="4 2" /><text x="952" y="572" font-size="12" font-weight="700" text-anchor="middle" stroke="none" fill="#d33">1</text><text x="976" y="572" font-size="12" stroke="none" fill="#d33">No blind retry</text></g>
</svg>
