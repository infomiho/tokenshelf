<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812" font-family="-apple-system, system-ui, sans-serif" fill="#fff" stroke="#000" stroke-width="1.5">
  <!-- Mobile viewport: 375x812 -->
  <rect x="0" y="0" width="375" height="812" />
  <!-- 1: mobile navigation -->
  <g transform="translate(0,0)"><rect width="375" height="64" /><text x="16" y="40" font-size="20" font-weight="600" stroke="none" fill="#000">TOKENSHELF</text><rect x="319" y="16" width="40" height="40" rx="4" /><line x1="331" y1="28" x2="347" y2="28" /><line x1="331" y1="36" x2="347" y2="36" /><line x1="331" y1="44" x2="347" y2="44" /></g>
  <!-- 2: editing context -->
  <g transform="translate(16,80)" data-region="editing-context">
    <text x="0" y="28" font-size="28" font-weight="700" stroke="none" fill="#000">Editing Gridline</text>
    <circle cx="8" cy="56" r="6" /><polyline points="4,56 8,60 16,50" fill="none" />
    <text x="24" y="60" font-size="14" font-weight="600" stroke="none" fill="#000">Published version live</text>
    <text x="24" y="88" font-size="14" text-decoration="underline" stroke="none" fill="#000">View published version</text>
    <g transform="translate(0,112)"><rect width="343" height="48" rx="4" /><text x="171" y="30" font-size="14" text-anchor="middle" stroke="none" fill="#000">Discard draft changes</text></g>
  </g>
  <!-- 3: draft preview first -->
  <g transform="translate(16,256)" data-region="draft-preview">
    <text x="0" y="20" font-size="20" font-weight="600" stroke="none" fill="#000">Draft preview</text>
    <rect x="0" y="40" width="343" height="168" rx="4" fill="#e6e6e6" />
    <rect x="16" y="80" width="311" height="32" rx="4" />
    <rect x="16" y="128" width="144" height="64" rx="4" /><rect x="176" y="128" width="151" height="64" rx="4" />
  </g>
  <!-- 4: review and publish after preview -->
  <g transform="translate(16,488)" data-region="publish-panel">
    <text x="0" y="20" font-size="20" font-weight="600" stroke="none" fill="#000">Ready to publish changes</text>
    <line x1="0" y1="64" x2="343" y2="64" />
    <text x="0" y="96" font-size="14" stroke="none" fill="#000">✓ Structure complete</text>
    <text x="0" y="120" font-size="14" stroke="none" fill="#000">✓ Accessibility checks passed</text>
    <rect x="0" y="144" width="20" height="20" rx="2" fill="#000" /><polyline points="4,155 9,160 16,150" stroke="#fff" fill="none" />
    <text x="32" y="160" font-size="12" stroke="none" fill="#000">I have the rights to share these changes.</text>
    <g transform="translate(0,176)"><rect width="343" height="48" rx="4" fill="#000" /><text x="171" y="30" font-size="14" font-weight="600" text-anchor="middle" stroke="none" fill="#fff">Publish changes</text></g>
  </g>
  <!-- 5: agent panel follows publishing controls -->
  <g transform="translate(16,736)" data-region="agent-panel"><rect width="343" height="56" rx="4" /><text x="16" y="24" font-size="14" font-weight="600" stroke="none" fill="#000">Agent access</text><text x="16" y="44" font-size="12" stroke="none" fill="#666">Can update this draft · cannot publish</text></g>
  <g data-region="annotations"><circle cx="359" cy="248" r="12" fill="#fff" stroke="#d33" stroke-dasharray="4 2" /><text x="359" y="252" font-size="12" font-weight="700" text-anchor="middle" stroke="none" fill="#d33">1</text><circle cx="359" cy="480" r="12" fill="#fff" stroke="#d33" stroke-dasharray="4 2" /><text x="359" y="484" font-size="12" font-weight="700" text-anchor="middle" stroke="none" fill="#d33">2</text></g>
</svg>
