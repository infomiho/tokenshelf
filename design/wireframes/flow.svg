<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560"
     font-family="-apple-system, system-ui, sans-serif" fill="#fff" stroke="#000" stroke-width="1.5">
  <!-- Flow: two personas · 1280x560 -->
  <rect x="0" y="0" width="1280" height="560" />

  <!-- consumer lane -->
  <text x="64" y="56" font-size="14" font-weight="700" stroke="none" fill="#000">USE: find a vibe, hand it to your agent</text>

  <g transform="translate(64,88)">
    <rect width="208" height="96" rx="6" />
    <text x="16" y="40" font-size="14" font-weight="600" stroke="none" fill="#000">01 · Landing</text>
    <text x="16" y="64" font-size="12" stroke="none" fill="#666">top picks · hot · new</text>
  </g>
  <line x1="272" y1="136" x2="326" y2="136" />
  <polygon points="336,136 326,130 326,142" fill="#000" stroke="none" />

  <g transform="translate(336,88)">
    <rect width="208" height="96" rx="6" />
    <text x="16" y="40" font-size="14" font-weight="600" stroke="none" fill="#000">02 · System detail</text>
    <text x="16" y="64" font-size="12" stroke="none" fill="#666">tokens · preview · stats</text>
  </g>
  <line x1="544" y1="136" x2="598" y2="136" />
  <polygon points="608,136 598,130 598,142" fill="#000" stroke="none" />

  <g transform="translate(608,88)">
    <rect width="208" height="96" rx="6" />
    <text x="16" y="40" font-size="14" font-weight="600" stroke="none" fill="#000">03 · Copy for agent</text>
    <text x="16" y="64" font-size="12" stroke="none" fill="#666">DESIGN.md · CSS · JSON</text>
  </g>
  <line x1="816" y1="136" x2="870" y2="136" />
  <polygon points="880,136 870,130 870,142" fill="#000" stroke="none" />

  <g transform="translate(880,88)">
    <rect width="208" height="96" rx="6" stroke-dasharray="6 3" />
    <text x="16" y="40" font-size="14" font-weight="600" stroke="none" fill="#000">Agent builds unique UI</text>
    <text x="16" y="64" font-size="12" stroke="none" fill="#666">CLAUDE.md / prompt</text>
  </g>

  <!-- upvote loop back to detail -->
  <polyline points="984,184 984,232 496,232 496,194" fill="none" stroke-dasharray="6 3" />
  <polygon points="496,184 490,194 502,194 496,184" fill="#000" stroke="none" />
  <text x="560" y="252" font-size="12" stroke="none" fill="#666">upvote</text>

  <line x1="64" y1="296" x2="1216" y2="296" stroke="#666" stroke-dasharray="2 4" />

  <!-- submitter lane -->
  <text x="64" y="344" font-size="14" font-weight="700" stroke="none" fill="#000">CURATE: you + your agent publish a system</text>

  <g transform="translate(64,376)">
    <rect width="208" height="96" rx="6" />
    <text x="16" y="40" font-size="14" font-weight="600" stroke="none" fill="#000">04 · Submit with agent</text>
    <text x="16" y="64" font-size="12" stroke="none" fill="#666">copy prompt · agent POSTs</text>
  </g>
  <line x1="272" y1="408" x2="326" y2="408" />
  <polygon points="336,408 326,402 326,414" fill="#000" stroke="none" />

  <g transform="translate(336,376)">
    <rect width="208" height="96" rx="6" />
    <text x="16" y="40" font-size="14" font-weight="600" stroke="none" fill="#000">05 · Review &amp; publish</text>
    <text x="16" y="64" font-size="12" stroke="none" fill="#666">auto checks + preview</text>
  </g>

  <!-- publish goes live at detail page -->
  <line x1="408" y1="376" x2="408" y2="194" />
  <polygon points="408,184 402,194 414,194 408,184" fill="#000" stroke="none" />
  <text x="420" y="240" font-size="12" stroke="none" fill="#666">goes live</text>

  <!-- manual fallback path -->
  <g transform="translate(608,376)">
    <rect width="208" height="96" rx="6" stroke-dasharray="6 3" />
    <text x="16" y="40" font-size="14" font-weight="600" stroke="none" fill="#000">Manual paste</text>
    <text x="16" y="64" font-size="12" stroke="none" fill="#666">standard format, by hand</text>
  </g>
  <line x1="608" y1="424" x2="554" y2="424" stroke-dasharray="6 3" />
  <polygon points="544,424 554,418 554,430" fill="#000" stroke="none" />
  <text x="552" y="412" font-size="12" stroke="none" fill="#666">fallback</text>

  <text x="64" y="528" font-size="12" stroke="none" fill="#666">solid = happy path · dashed = secondary / automated</text>
</svg>
