<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tokenshelf social image</title>
    <style>
      @font-face {
        font-family: "Satoshi";
        src: url("/fonts/satoshi-bold.woff2") format("woff2");
        font-weight: 700;
      }

      @font-face {
        font-family: "Satoshi";
        src: url("/fonts/satoshi-black.woff2") format("woff2");
        font-weight: 900;
      }

      :root {
        --paper: #fbfaf8;
        --surface: #ffffff;
        --ink: #20201d;
        --muted: #696862;
        --dots: rgb(170 167 161 / 0.31);
        --brand: #a7016d;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
      }

      body {
        font-family: "Satoshi", Arial, sans-serif;
      }

      .card {
        width: 1200px;
        height: 630px;
        padding: 54px 64px;
        background-color: var(--paper);
        background-image: radial-gradient(circle, var(--dots) 0 1px, transparent 1.2px);
        background-position: 2px 2px;
        background-size: 28px 28px;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .brand-lockup {
        display: flex;
        align-items: center;
        gap: 19px;
      }

      .brand-lockup > svg {
        width: 43px;
        height: 43px;
        color: var(--brand);
      }

      .brand-name {
        color: var(--ink);
        font-size: 34px;
        font-weight: 900;
        letter-spacing: -1.5px;
      }

      .domain,
      .kicker {
        font-family: "SFMono-Regular", Consolas, monospace;
      }

      .domain {
        color: var(--muted);
        font-size: 15px;
        letter-spacing: 0.8px;
      }

      .kicker {
        margin-top: 78px;
        color: var(--brand);
        font-size: 15px;
        letter-spacing: 2.8px;
      }

      h1 {
        margin: 43px 0 0;
        color: var(--ink);
        font-size: 78px;
        font-weight: 900;
        letter-spacing: -4.3px;
        line-height: 1.08;
      }

      .actions {
        display: flex;
        gap: 14px;
        margin-top: 55px;
      }

      .action {
        display: inline-flex;
        min-height: 54px;
        align-items: center;
        gap: 10px;
        padding: 0 18px 0 15px;
        border-radius: 11px;
        background: var(--surface);
        color: var(--ink);
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.2px;
        white-space: nowrap;
      }

      .action svg {
        width: 21px;
        height: 21px;
        flex: none;
        color: var(--brand);
        fill: currentColor;
      }
    </style>
  </head>
  <body>
    <main class="card" aria-label="Tokenshelf: Hand-picked design systems for your agent">
      <header class="header">
        <div class="brand-lockup">
          <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m4 9 14-6 10 5-14 6L4 9Z"></path>
            <path d="M4 9v16l10 5V14M28 8v16l-14 6"></path>
            <path d="m14 19 14-6M14 25l14-6"></path>
          </svg>
          <span class="brand-name">Tokenshelf</span>
        </div>
        <span class="domain">tokenshelf.dev</span>
      </header>

      <div class="kicker">AGENT NATIVE</div>
      <h1>Hand-picked design<br />systems for your agent.</h1>

      <div class="actions" aria-label="Tokenshelf features">
        <span class="action">
          <svg viewBox="0 0 256 256" aria-hidden="true">
            <path d="M239.18,97.26A16.38,16.38,0,0,0,224.92,86l-59-4.76L143.14,26.15a16.36,16.36,0,0,0-30.27,0L90.11,81.23,31.08,86a16.46,16.46,0,0,0-9.37,28.86l45,38.83L53,211.75a16.38,16.38,0,0,0,24.5,17.82L128,198.49l50.53,31.08A16.4,16.4,0,0,0,203,211.75l-13.76-58.07,45-38.83A16.43,16.43,0,0,0,239.18,97.26Zm-15.34,5.47-48.7,42a8,8,0,0,0-2.56,7.91l14.88,62.8a.37.37,0,0,1-.17.48c-.18.14-.23.11-.38,0l-54.72-33.65a8,8,0,0,0-8.38,0L69.09,215.94c-.15.09-.19.12-.38,0a.37.37,0,0,1-.17-.48l14.88-62.8a8,8,0,0,0-2.56-7.91l-48.7-42c-.12-.1-.23-.19-.13-.5s.18-.27.33-.29l63.92-5.16A8,8,0,0,0,103,91.86l24.62-59.61c.08-.17.11-.25.35-.25s.27.08.35.25L153,91.86a8,8,0,0,0,6.75,4.92l63.92,5.16c.15,0,.24,0,.33.29S224,102.63,223.84,102.73Z"></path>
          </svg>
          Community picks
        </span>
        <span class="action">
          <svg viewBox="0 0 256 256" aria-hidden="true">
            <path d="M184,64H40a8,8,0,0,0-8,8V216a8,8,0,0,0,8,8H184a8,8,0,0,0,8-8V72A8,8,0,0,0,184,64Zm-8,144H48V80H176ZM224,40V184a8,8,0,0,1-16,0V48H72a8,8,0,0,1,0-16H216A8,8,0,0,1,224,40Z"></path>
          </svg>
          Copy DESIGN.md prompt
        </span>
        <span class="action">
          <svg viewBox="0 0 256 256" aria-hidden="true">
            <path d="M224,144v64a8,8,0,0,1-8,8H40a8,8,0,0,1-8-8V144a8,8,0,0,1,16,0v56H208V144a8,8,0,0,1,16,0ZM93.66,77.66,120,51.31V144a8,8,0,0,0,16,0V51.31l26.34,26.35a8,8,0,0,0,11.32-11.32l-40-40a8,8,0,0,0-11.32,0l-40,40A8,8,0,0,0,93.66,77.66Z"></path>
          </svg>
          Submit your own
        </span>
      </div>
    </main>
  </body>
</html>
